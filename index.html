<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wesh Grow — Contrôle préparation restaurants</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg: #1B2118;
    --bg-alt: #212820;
    --card: #232B1F;
    --card-border: #384231;
    --ink: #ECE7DA;
    --ink-muted: #9BA290;
    --amber: #E2A23B;
    --amber-dim: #4A3B24;
    --green: #6FCF73;
    --green-dim: #223326;
    --red: #D9694F;
    --line: #333C2C;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(226,162,59,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(111,207,115,0.05), transparent 45%);
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    min-height: 100vh;
  }
  .mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-alt);
    position: sticky; top:0; z-index: 10;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .name{ font-weight:800; font-size:1.15rem; letter-spacing:-0.01em; }
  .brand .sub{ font-size:0.82rem; color: var(--ink-muted); }
  .brand .sub .date{ color: var(--amber); font-weight:600; }

  #userbox{ display:flex; align-items:center; gap:12px; }
  #userbox img{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); }
  #userbox .email{ font-size:0.8rem; color: var(--ink-muted); }
  button{
    font-family:'Manrope', sans-serif; font-weight:700; font-size:0.88rem;
    border-radius: 8px; border: 1px solid var(--line); cursor:pointer;
    padding: 9px 16px; background: var(--card); color: var(--ink);
    transition: transform .08s ease, border-color .15s ease;
  }
  button:hover{ border-color: var(--amber); }
  button:active{ transform: scale(0.97); }
  button.primary{ background: var(--amber); color:#1B2118; border-color: var(--amber); }
  button.ghost{ background: transparent; }
  button:disabled{ opacity:0.45; cursor:default; }

  main{ max-width: 920px; margin: 0 auto; padding: 28px 20px 80px; }

  #gate{ text-align:center; padding: 90px 20px; }
  #gate h1{ font-size:1.4rem; margin-bottom:8px; }
  #gate p{ color: var(--ink-muted); max-width: 420px; margin: 0 auto 26px; line-height:1.5; }

  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-bottom: 22px; flex-wrap:wrap;
  }
  .progress{ font-size:0.85rem; color: var(--ink-muted); }
  .progress b{ color: var(--ink); }

  #status{ font-size:0.85rem; color: var(--ink-muted); min-height:1.2em; margin-bottom:14px; }
  #status.err{ color: var(--red); }

  .ticket{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow:hidden;
    transition: opacity .3s ease;
  }
  .ticket.done{ opacity: 0.5; }
  .ticket-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px; gap: 12px;
    border-bottom: 1px dashed var(--line);
  }
  .ticket-head .client{ font-weight:800; font-size:1.02rem; }
  .ticket-head .count{ font-size:0.78rem; color: var(--ink-muted); }
  .ticket-body{ padding: 10px 18px 6px; }
  .line{
    display:flex; justify-content:space-between; align-items:center;
    padding: 7px 0; border-bottom: 1px solid var(--line); font-size:0.9rem;
  }
  .line:last-child{ border-bottom:none; }
  .line .ref{ color: var(--ink); }
  .line .qty{ color: var(--amber); font-weight:600; }
  .ticket-foot{ padding: 12px 18px 16px; display:flex; justify-content:flex-end; }

  .check-btn{
    display:flex; align-items:center; gap:8px;
    background: var(--amber-dim); color: var(--amber); border-color: var(--amber-dim);
  }
  .check-btn:hover{ border-color: var(--amber); }
  .check-btn.checked{
    background: var(--green-dim); color: var(--green); border-color: var(--green-dim);
  }
  .check-btn .meta{ font-size:0.72rem; opacity:0.85; font-weight:500; }

  #empty{ text-align:center; color: var(--ink-muted); padding: 60px 20px; }
  #unclassified{
    margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 0.82rem; color: var(--ink-muted);
  }
  #unclassified summary{ cursor:pointer; color: var(--ink); font-weight:700; margin-bottom:8px; }
  #unclassified li{ margin-bottom: 3px; }

  .spinner{
    width:16px; height:16px; border-radius:50%;
    border: 2px solid var(--ink-muted); border-top-color: var(--amber);
    animation: spin .7s linear infinite; display:inline-block;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="name">Wesh Grow — Prépa restaurants</span>
    <span class="sub">Commandes du <span class="date" id="today-label">—</span></span>
  </div>
  <div id="userbox"></div>
</header>

<main>
  <div id="gate">
    <h1>Connexion requise</h1>
    <p>Connectez-vous avec le compte Google Workspace ayant accès au fichier de commandes pour voir la liste du jour.</p>
    <button class="primary" id="signin-btn">Se connecter avec Google</button>
  </div>

  <div id="app" style="display:none;">
    <div id="status"></div>
    <div class="toolbar">
      <div class="progress" id="progress">—</div>
      <button class="ghost" id="refresh-btn">↻ Actualiser</button>
    </div>
    <div id="tickets"></div>
    <div id="empty" style="display:none;">Aucune commande restaurant pour aujourd'hui.</div>
    <details id="unclassified" style="display:none;">
      <summary>Clients non reconnus (à vérifier)</summary>
      <ul id="unclassified-list"></ul>
    </details>
  </div>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
